name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore TSTOP.slnx

      - name: Build .NET solution
        run: dotnet build TSTOP.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test TSTOP.slnx --configuration Release --no-build --verbosity minimal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: angular/yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install ABP CLI
        run: |
          dotnet tool install --tool-path ./.abp-tools Volo.Abp.Cli --version 10.4.0

      - name: Restore ABP MVC libs
        run: |
          # Must run from solution root where TSTOP.abpsln is located.
          ./.abp-tools/abp install-libs

      - name: Publish API artifacts
        run: dotnet publish src/TSTOP.HttpApi.Host/TSTOP.HttpApi.Host.csproj --configuration Release --output artifacts/api --no-build

      - name: Install Angular dependencies
        working-directory: angular
        run: yarn install --frozen-lockfile

      - name: Build Angular app
        working-directory: angular
        run: yarn build:prod

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: artifacts/api

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: angular/dist

  cd:
    name: Deploy with Docker Compose
    runs-on: self-hosted
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      HTTP_PROXY: http://127.0.0.1:7897
      HTTPS_PROXY: http://127.0.0.1:7897
      NO_PROXY: localhost,127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write .env file
        shell: pwsh
        run: |
          $envContent = @(
            "POSTGRES_USER=${{ secrets.POSTGRES_USER }}"
            "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}"
            "TSTOP_CONNECTION_STRING=${{ secrets.TSTOP_CONNECTION_STRING }}"
            "APP_SELF_URL=${{ vars.APP_SELF_URL || 'http://localhost:8080' }}"
            "AUTH_SERVER_AUTHORITY=${{ vars.AUTH_SERVER_AUTHORITY || 'http://localhost:8080' }}"
            "ASPNETCORE_ENVIRONMENT=${{ vars.ASPNETCORE_ENVIRONMENT || 'Staging' }}"
            "API_PORT=${{ vars.CD_API_PORT || '8080' }}"
            "WEB_PORT=${{ vars.CD_WEB_PORT || '80' }}"
          )
          $envContent | Set-Content -Path ".env" -Encoding UTF8

      - name: Deploy with Docker Compose
        shell: pwsh
        run: docker compose up --build --remove-orphans -d

      - name: Verify deployment
        shell: pwsh
        run: docker compose ps
