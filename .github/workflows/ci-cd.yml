name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore TSTOP.slnx

      - name: Build .NET solution
        run: dotnet build TSTOP.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test TSTOP.slnx --configuration Release --no-build --verbosity minimal

      - name: Publish API artifacts
        run: dotnet publish src/TSTOP.HttpApi.Host/TSTOP.HttpApi.Host.csproj --configuration Release --output artifacts/api --no-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: angular/yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install Angular dependencies
        working-directory: angular
        run: yarn install --frozen-lockfile

      - name: Build Angular app
        working-directory: angular
        run: yarn build:prod

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: artifacts/api

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: angular/dist

  cd:
    name: Deploy to local runner
    runs-on: self-hosted
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: deploy/api

      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: deploy/web

      - name: Deploy artifacts
        shell: pwsh
        env:
          API_TARGET: ${{ vars.CD_API_TARGET }}
          WEB_TARGET: ${{ vars.CD_WEB_TARGET }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_TARGET)) {
            Write-Host 'CD_API_TARGET is not configured. Skipping API deployment.'
          } else {
            New-Item -ItemType Directory -Path $env:API_TARGET -Force | Out-Null
            Copy-Item -Path "deploy/api/*" -Destination $env:API_TARGET -Recurse -Force
            Write-Host "API deployed to $env:API_TARGET"
          }

          if ([string]::IsNullOrWhiteSpace($env:WEB_TARGET)) {
            Write-Host 'CD_WEB_TARGET is not configured. Skipping Angular deployment.'
          } else {
            New-Item -ItemType Directory -Path $env:WEB_TARGET -Force | Out-Null
            Copy-Item -Path "deploy/web/*" -Destination $env:WEB_TARGET -Recurse -Force
            Write-Host "Angular app deployed to $env:WEB_TARGET"
          }
