name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore TSTOP.slnx

      - name: Build .NET solution
        run: dotnet build TSTOP.slnx --configuration Release --no-restore

      - name: Run .NET tests
        run: dotnet test TSTOP.slnx --configuration Release --no-build --verbosity minimal

      - name: Publish API artifacts
        run: dotnet publish src/TSTOP.HttpApi.Host/TSTOP.HttpApi.Host.csproj --configuration Release --output artifacts/api --no-build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: angular/yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install Angular dependencies
        working-directory: angular
        run: yarn install --frozen-lockfile

      - name: Build Angular app
        working-directory: angular
        run: yarn build:prod

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: artifacts/api

      - name: Upload Angular artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: angular/dist

  cd:
    name: Deploy with Docker
    runs-on: self-hosted
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    env:
      HTTP_PROXY: http://127.0.0.1:7897
      HTTPS_PROXY: http://127.0.0.1:7897
      NO_PROXY: localhost,127.0.0.1
      API_IMAGE: ${{ vars.CD_API_IMAGE || 'tstop-api:latest' }}
      WEB_IMAGE: ${{ vars.CD_WEB_IMAGE || 'tstop-web:latest' }}
      API_CONTAINER: ${{ vars.CD_API_CONTAINER || 'tstop-api' }}
      WEB_CONTAINER: ${{ vars.CD_WEB_CONTAINER || 'tstop-web' }}
      API_PORT: ${{ vars.CD_API_PORT || '8080' }}
      WEB_PORT: ${{ vars.CD_WEB_PORT || '80' }}
      AuthServer__UseDevelopmentCertificates: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: deploy/api

      - name: Download Angular artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: deploy/web

      - name: Build Docker images
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "deploy/docker/api" -Force | Out-Null
          Copy-Item -Path "deploy/api/*" -Destination "deploy/docker/api" -Recurse -Force
          @'
          FROM mcr.microsoft.com/dotnet/aspnet:10.0
          WORKDIR /app
          COPY . .
          ENV ASPNETCORE_URLS=http://+:8080
          EXPOSE 8080
          ENTRYPOINT ["dotnet", "TSTOP.HttpApi.Host.dll"]
          '@ | Set-Content -Path "deploy/docker/api/Dockerfile" -Encoding UTF8
          docker build -t $env:API_IMAGE deploy/docker/api

          New-Item -ItemType Directory -Path "deploy/docker/web/html" -Force | Out-Null
          Copy-Item -Path "deploy/web/TSTOP/browser/*" -Destination "deploy/docker/web/html" -Recurse -Force
          Copy-Item -Path "angular/dynamic-env.json" -Destination "deploy/docker/web/dynamic-env.json" -Force
          Copy-Item -Path "angular/nginx.conf" -Destination "deploy/docker/web/nginx.conf" -Force
          @'
          FROM nginx:alpine
          COPY html /usr/share/nginx/html
          COPY dynamic-env.json /usr/share/nginx/html/dynamic-env.json
          COPY nginx.conf /etc/nginx/conf.d/default.conf
          EXPOSE 80
          '@ | Set-Content -Path "deploy/docker/web/Dockerfile" -Encoding UTF8
          docker build -t $env:WEB_IMAGE deploy/docker/web

      - name: Deploy Docker containers
        shell: pwsh
        run: |
          function Remove-ContainerIfExists([string]$containerName) {
            $existingContainer = docker ps -a --format '{{.Names}}' | Where-Object { $_ -eq $containerName }
            if ($existingContainer) {
              docker rm -f $containerName | Out-Null
            }
          }

          function Ensure-ContainerRunning([string]$containerName) {
            $runningContainer = docker ps --format '{{.Names}}' | Where-Object { $_ -eq $containerName }
            if (-not $runningContainer) {
              throw "Container '$containerName' is not running after deployment."
            }
          }

          Remove-ContainerIfExists $env:API_CONTAINER
          docker run -d --name $env:API_CONTAINER --restart unless-stopped -p "${env:API_PORT}:8080" `
            -e "ASPNETCORE_ENVIRONMENT=Staging" `
            -e "AuthServer__UseDevelopmentCertificates=true" `
            $env:API_IMAGE | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start API container '$env:API_CONTAINER'."
          }
          Ensure-ContainerRunning $env:API_CONTAINER

          Remove-ContainerIfExists $env:WEB_CONTAINER
          docker run -d --name $env:WEB_CONTAINER --restart unless-stopped -p "${env:WEB_PORT}:80" $env:WEB_IMAGE | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to start web container '$env:WEB_CONTAINER'."
          }
          Ensure-ContainerRunning $env:WEB_CONTAINER

          Write-Host "API container '$env:API_CONTAINER' is running on port $env:API_PORT using image $env:API_IMAGE"
          Write-Host "Web container '$env:WEB_CONTAINER' is running on port $env:WEB_PORT using image $env:WEB_IMAGE"
